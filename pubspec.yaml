name: tap_and_learn_kids
description: "Tap & Learn Kids - a friendly tap-to-recognize learning game for early learners."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/words/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/images/fruits/
    - assets/images/animals/
    - assets/images/vehicles/
    - assets/images/shapes/
    - assets/images/colors/
    - assets/images/mascots/
    - assets/images/category_icons/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
    # A static (non-variable) ExtraBold instance baked out of Baloo2's
    # wght axis with fonttools. Some Android renderers don't apply a
    # variable font's weight axis reliably at runtime, so the "bold"
    # named-instance entries above can render visually thin on-device.
    # This file has no variable axis at all — it IS the bold glyphs —
    # so it always renders heavy regardless of renderer quirks.
    - family: BalooBold
      fonts:
        - asset: assets/fonts/Baloo2-ExtraBold-Static.ttf
          weight: 800
