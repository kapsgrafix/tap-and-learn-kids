name: tap_and_learn_kids
description: "Tap & Learn Kids - a friendly tap-to-recognize learning game for early learners."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/words/
    - assets/audio/sfx/
    - assets/images/fruits/
    - assets/images/animals/
    - assets/images/vehicles/
    - assets/images/shapes/
    - assets/images/colors/
    - assets/images/mascots/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
